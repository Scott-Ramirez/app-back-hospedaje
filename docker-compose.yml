version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: hospedaje-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hospedaje_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build: .
    container_name: hospedaje-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-3000}
      - DB_HOST=${DB_HOST:-database}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_DATABASE=${DB_DATABASE:-hospedaje_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_token_key_123!}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123!}
      - DEFAULT_ADMIN_NOMBRE=${DEFAULT_ADMIN_NOMBRE:-Administrador General}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
    depends_on:
      - database
    volumes:
      - ./uploads:/app/uploads

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hospedaje-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    depends_on:
      - database

volumes:
  mysql-data:
